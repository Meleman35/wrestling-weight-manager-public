name: Linked Creator workspace verification
on:
  push:
    branches: [codex/creator-linked-access]
    paths:
      - scripts/prepare-creator-linked-access.py
      - scripts/patch-creator-protocol-test.py
      - tests/creator-linked-access-db.mjs
      - tests/creator-linked-access-browser.cjs
      - .github/workflows/creator-linked-access.yml
  pull_request:
    paths:
      - index.html
      - src/creator-offers.*
      - supabase/creator-linked-access.sql
      - scripts/prepare-creator-linked-access.py
      - scripts/patch-creator-protocol-test.py
      - scripts/scoped-deletion-policy.json
      - tests/creator-linked-access*
      - tests/account-deletion-phone-browser.cjs
      - .github/workflows/creator-linked-access.yml
permissions:
  contents: read
jobs:
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/creator-linked-access'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NODE_PATH: ${{ github.workspace }}/.ci/node_modules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix .ci --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/prepare-creator-linked-access.py && python3 scripts/prepare-creator-linked-access.py --check && python3 scripts/patch-creator-protocol-test.py && python3 scripts/patch-creator-protocol-test.py --check
      - run: node --check src/creator-offers.js && node tests/creator-offers-db.mjs && node tests/creator-offers-compatibility.mjs && node tests/creator-linked-access-db.mjs && node tests/creator-linked-access-compatibility.mjs
      - run: node tests/athlete-health-db.mjs && node tests/practice-plans-db.mjs
      - run: .ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Select installed Chromium
        run: node -e 'process.stdout.write("CHROMIUM_EXECUTABLE_PATH="+require("playwright").chromium.executablePath()+"\n")' >> "$GITHUB_ENV"
      - run: node tests/creator-offers-browser.cjs && node tests/creator-linked-access-browser.cjs && node tests/athlete-health-browser.cjs
      - run: node tests/account-deletion-phone-browser.cjs && node tests/account-deletion-scoped-browser.cjs && node tests/account-deletion-native-browser.cjs
      - name: Save verified generated sources on this branch only
        run: |
          test "$GITHUB_REF" = refs/heads/codex/creator-linked-access
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/creator-offers.js supabase/creator-linked-access.sql scripts/scoped-deletion-policy.json tests/creator-linked-access-compatibility.mjs tests/account-deletion-phone-browser.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize verified linked Creator workspace and protocol regression'
            git push origin HEAD:refs/heads/codex/creator-linked-access
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linked-creator-results
          path: |
            validation/creator-*
            validation/account-deletion-*.json
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_PATH: ${{ github.workspace }}/.ci/node_modules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix .ci --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/prepare-creator-linked-access.py --check && python3 scripts/patch-creator-protocol-test.py --check
      - run: node tests/creator-linked-access-db.mjs && node tests/creator-linked-access-compatibility.mjs
      - run: .ci/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/creator-linked-access-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linked-creator-pr-results
          path: validation/creator-linked*
