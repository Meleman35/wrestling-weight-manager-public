name: Account deletion availability
on:
  push:
    branches: [codex/deletion-availability]
    paths:
      - scripts/prepare-deletion-availability.py
      - tests/deletion-availability-browser.cjs
      - .github/workflows/deletion-availability.yml
  pull_request:
    paths:
      - index.html
      - sw.js
      - src/account-deletion-phone-test.js
      - scripts/prepare-deletion-availability.py
      - tests/*deletion*.cjs
      - .github/workflows/deletion-availability.yml
permissions:
  contents: read
concurrency:
  group: deletion-availability-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      NODE_PATH: ${{ github.workspace }}/.ci/node_modules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix .ci --ignore-scripts --no-audit --no-fund
      - run: |
          python3 scripts/prepare-deletion-availability.py
          python3 scripts/prepare-deletion-availability.py --check
          python3 scripts/prepare-notification-header.py --check
          python3 scripts/prepare-health-notification-release.py --check
          python3 scripts/prepare-launch-information.py --check
          python3 scripts/prepare-linked-creator-release.py --check
          node --check src/account-deletion-phone-test.js
          git diff --exit-code -- supabase src/scoped-deletion-client.js src/account-deletion-device.js
      - run: |
          node tests/account-deletion-native-client.cjs
          node tests/account-deletion-phone-db.cjs
          node tests/scoped-deletion-plan.mjs
          node tests/scoped-deletion-service.mjs
          node tests/scoped-deletion-handler.mjs
      - run: .ci/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/deletion-availability-browser.cjs && node tests/account-deletion-native-browser.cjs && node tests/account-deletion-scoped-browser.cjs
      - name: Commit verified generated sources on the isolated branch only
        run: |
          test "$GITHUB_REF" = refs/heads/codex/deletion-availability
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js src/account-deletion-phone-test.js tests/account-deletion-phone-browser.cjs scripts/prepare-notification-header.py scripts/prepare-launch-information.py scripts/prepare-linked-creator-release.py
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize verified deletion availability 0.20.118; erasure authority unchanged'
            git push origin HEAD:refs/heads/codex/deletion-availability
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deletion-availability-candidate
          path: |
            validation/*deletion*
            index.html
            sw.js
            src/account-deletion-phone-test.js
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_PATH: ${{ github.workspace }}/.ci/node_modules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix .ci --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/prepare-deletion-availability.py --check
      - run: node tests/account-deletion-native-client.cjs && node tests/account-deletion-phone-db.cjs
      - run: .ci/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/deletion-availability-browser.cjs && node tests/account-deletion-native-browser.cjs && node tests/account-deletion-scoped-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deletion-availability-pr-results
          path: validation/*deletion*
