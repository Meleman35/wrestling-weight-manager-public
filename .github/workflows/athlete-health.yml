name: Athlete Health regression
on:
  pull_request:
    paths:
      - index.html
      - src/athlete-health.*
      - src/clipboard-navigation.js
      - supabase/athlete-health*.sql
      - supabase/migrations/*team_trainer_athlete_health*.sql
      - scripts/*athlete-health.py
      - tests/athlete-health*
      - tests/fixtures/health-*
      - tests/fixtures/athlete-health-*
      - .github/workflows/athlete-health.yml
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_PATH: ${{ github.workspace }}/.ci/node_modules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix .ci --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/assemble-athlete-health.py --check && python3 scripts/patch-athlete-health.py --check
      - run: node tests/athlete-health-db.mjs
      - run: .ci/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/athlete-health-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: athlete-health-results
          path: validation/athlete-health*
