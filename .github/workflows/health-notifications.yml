name: Care notification verification
on:
  push:
    branches: [codex/health-update-notifications]
    paths:
      - scripts/prepare-health-notification*.py
      - scripts/finish-health-notification-copy.py
      - supabase/health-notifications-core.sql
      - tests/health-notifications-db.mjs
      - tests/health-notifications-browser-cases.js
      - .github/workflows/health-notifications.yml
  pull_request:
    paths:
      - index.html
      - support.html
      - privacy.html
      - sw.js
      - src/athlete-health.*
      - src/notification-inbox.js
      - supabase/health-notifications*.sql
      - scripts/prepare-health-notification*.py
      - scripts/finish-health-notification-copy.py
      - tests/health-notification*
      - .github/workflows/health-notifications.yml
permissions:
  contents: read
concurrency:
  group: care-notifications-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NODE_PATH: ${{ github.workspace }}/.ci/node_modules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix .ci --ignore-scripts --no-audit --no-fund
      - run: |
          python3 scripts/prepare-health-notification-release.py
          python3 scripts/prepare-health-notification-release.py --check
          python3 scripts/prepare-trainer-dashboard.py --check
          python3 scripts/prepare-launch-information.py --check
          python3 scripts/prepare-linked-creator-release.py --check
          node --check src/athlete-health.js
          node --check src/notification-inbox.js
      - run: node tests/athlete-health-db.mjs && node tests/health-notifications-db.mjs
      - run: .ci/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/athlete-health-browser.cjs && node tests/trainer-dashboard-browser.cjs && node tests/health-notifications-browser.cjs && node tests/creator-linked-release-browser.cjs && node tests/launch-information-browser.cjs
      - name: Materialize tested source on the isolated branch only
        run: |
          test "$GITHUB_REF" = refs/heads/codex/health-update-notifications
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js support.html privacy.html docs/athlete-health.md src/athlete-health.js src/athlete-health.css src/notification-inbox.js supabase/health-notifications.sql scripts/prepare-health-notifications.py scripts/prepare-linked-creator-release.py scripts/prepare-launch-information.py tests/health-notifications-db.mjs tests/health-notification-fixture.mjs tests/health-notifications-browser.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize verified 0.20.116 care release; hosted deployment separate'
            git push origin HEAD:refs/heads/codex/health-update-notifications
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: care-notification-candidate
          path: |
            validation/health-notification*
            validation/launch-*
            index.html
            sw.js
            support.html
            privacy.html
            docs/athlete-health.md
            src/athlete-health.js
            src/athlete-health.css
            src/notification-inbox.js
            supabase/health-notifications.sql
            supabase/health-notifications-core.sql
            scripts/prepare-health-notification*.py
            scripts/finish-health-notification-copy.py
            scripts/prepare-launch-information.py
            scripts/prepare-linked-creator-release.py
            tests/health-notification*
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_PATH: ${{ github.workspace }}/.ci/node_modules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix .ci --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/prepare-health-notification-release.py --check
      - run: node tests/health-notifications-db.mjs
      - run: .ci/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/health-notifications-browser.cjs && node tests/launch-information-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: care-notification-pr-results
          path: validation/health-notification*
