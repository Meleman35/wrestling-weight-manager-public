name: Account layout
on:
  pull_request:
    paths: ['index.html', 'src/account-layout.js', 'tests/account-layout-browser.cjs', '.github/workflows/account-layout.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p validation && node tests/account-layout-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-layout-preview
          path: validation/account-layout-phone.png
