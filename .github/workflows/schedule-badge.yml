name: Schedule badge regression
on:
  push:
    branches: [codex/schedule-notification-baseline]
  pull_request:
    paths:
      - index.html
      - sw.js
      - src/schedule-badges.js
      - tests/schedule-badges*.cjs
      - scripts/patch-schedule-badges.py
      - .github/workflows/schedule-badge.yml
permissions:
  contents: read
concurrency:
  group: schedule-badge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  badge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_PATH: ${{ github.workspace }}/.ci/node_modules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python3 scripts/patch-schedule-badges.py --check
      - run: node tests/schedule-badges.cjs
      - run: npm ci --prefix .ci --ignore-scripts --no-audit --no-fund
      - run: .ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Select installed Chromium
        run: node -e 'process.stdout.write("CHROMIUM_EXECUTABLE_PATH="+require("playwright").chromium.executablePath()+"\n")' >> "$GITHUB_ENV"
      - run: node tests/schedule-badges-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: schedule-badge-results
          path: validation/schedule-badges*.json
          if-no-files-found: error
