name: Wrestler statistics regression
on:
  pull_request:
    paths:
      - index.html
      - src/wrestler-statistics*.js
      - scripts/patch-wrestler-statistics.py
      - supabase/migrations/*wrestler_statistics*.sql
      - tests/wrestler-statistics*.cjs
      - .github/workflows/wrestler-statistics.yml
permissions:
  contents: read
jobs:
  statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_PATH: ${{ github.workspace }}/.ci/node_modules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix .ci --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/patch-wrestler-statistics.py --check
      - run: node tests/wrestler-statistics.cjs
      - run: node tests/wrestler-statistics-db.cjs
      - run: .ci/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/wrestler-statistics-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wrestler-statistics-results
          path: validation/wrestler-statistics*
