name: Compact notification header
on:
  push:
    branches: [codex/compact-notification-header]
    paths:
      - scripts/prepare-notification-header.py
      - src/notification-header.css
      - tests/notification-header-browser.cjs
      - .github/workflows/notification-header.yml
  pull_request:
    paths:
      - index.html
      - sw.js
      - src/notification-inbox.js
      - src/notification-header.css
      - scripts/prepare-notification-header.py
      - tests/notification-header-browser.cjs
      - .github/workflows/notification-header.yml
permissions:
  contents: read
concurrency:
  group: notification-header-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      NODE_PATH: ${{ github.workspace }}/.ci/node_modules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix .ci --ignore-scripts --no-audit --no-fund
      - run: |
          python3 scripts/prepare-notification-header.py
          python3 scripts/prepare-notification-header.py --check
          python3 scripts/prepare-health-notification-release.py --check
          python3 scripts/prepare-launch-information.py --check
          python3 scripts/prepare-linked-creator-release.py --check
          node --check src/notification-inbox.js
          git diff --exit-code -- src/account-deletion-phone-test.js src/scoped-deletion-client.js src/account-deletion-device.js supabase
      - run: .ci/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/notification-header-browser.cjs && node tests/account-deletion-native-browser.cjs && node tests/creator-linked-release-browser.cjs
      - name: Commit tested generated frontend only
        run: |
          test "$GITHUB_REF" = refs/heads/codex/compact-notification-header
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js src/notification-inbox.js scripts/prepare-linked-creator-release.py scripts/prepare-launch-information.py
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize tested compact notification header 0.20.117'
            git push origin HEAD:refs/heads/codex/compact-notification-header
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compact-notification-header
          path: |
            validation/notification-header*
            validation/health-notification*
            index.html
            sw.js
            src/notification-inbox.js
            src/notification-header.css
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_PATH: ${{ github.workspace }}/.ci/node_modules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix .ci --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/prepare-notification-header.py --check
      - run: .ci/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/notification-header-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compact-header-pr-verification
          path: validation/notification-header*
