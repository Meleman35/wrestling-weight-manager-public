name: Creator role preview verification
on:
  push:
    branches: [codex/creator-role-previews]
    paths:
      - src/creator-role-preview.*
      - src/role-preview-demo.*
      - scripts/patch-creator-role-preview.py
      - tests/creator-role-preview-browser.cjs
      - .github/workflows/creator-role-preview.yml
  pull_request:
    paths:
      - index.html
      - src/creator-role-preview.*
      - src/role-preview-demo.*
      - scripts/patch-creator-role-preview.py
      - tests/creator-role-preview-browser.cjs
      - .github/workflows/creator-role-preview.yml
permissions:
  contents: read
jobs:
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/creator-role-previews'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NODE_PATH: ${{ github.workspace }}/.ci/node_modules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix .ci --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/patch-creator-role-preview.py && python3 scripts/patch-creator-role-preview.py --check
      - run: node --check src/role-preview-demo.js && node --check src/creator-role-preview.js
      - run: .ci/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/creator-role-preview-browser.cjs && node tests/creator-offers-browser.cjs && node tests/trainer-dashboard-browser.cjs && node tests/athlete-health-browser.cjs
      - name: Materialize tested web files on this branch only
        run: |
          test "$GITHUB_REF" = refs/heads/codex/creator-role-previews
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize verified Creator role previews web 0.20.113'
            git push origin HEAD:refs/heads/codex/creator-role-previews
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: creator-role-preview-results
          path: validation/creator-role-preview-*
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_PATH: ${{ github.workspace }}/.ci/node_modules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix .ci --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/patch-creator-role-preview.py --check
      - run: .ci/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/creator-role-preview-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: creator-role-preview-pr-results
          path: validation/creator-role-preview-*
