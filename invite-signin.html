<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://vfocpoyexnjsjpxhhyqr.supabase.co; base-uri 'none'; form-action 'none'"><title>Join your team | Wrestling Manager</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f9;color:#152238;font:18px/1.6 system-ui,sans-serif;padding:20px}main{max-width:540px;margin:5vh auto;padding:28px;background:white;border-radius:24px}h1{font-size:30px;line-height:1.2}button,a{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:#143f85;color:white;font:700 18px system-ui;text-align:center;text-decoration:none;margin:16px 0}button:disabled{opacity:.6}input{width:100%;font:inherit;padding:12px;border:1px solid #adb8c8;border-radius:10px}small{font-weight:750;color:#143f85}.note{font-size:15px}summary{cursor:pointer}#status{overflow-wrap:anywhere}</style></head><body><main><small>WRESTLING MANAGER</small><h1>Join your team</h1><p>Confirm your email and sign in with one step.</p><p id="recipient"></p><button id="confirm">Confirm &amp; join team</button><p id="status" role="status" aria-live="polite">No second confirmation email. No password needed.</p><details><summary>Use the code from your email</summary><form id="codeForm"><label for="code">One-time email code</label><input id="code" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6,10}" minlength="6" maxlength="10" required><button id="verifyCode">Confirm code &amp; join</button></form></details><p class="note">You can finish in this browser. No app or TestFlight installation is required.</p><a id="return" href="https://theteammanager.app/" style="background:#eaf0fa;color:#143f85">Return to sign in</a></main><script>
(()=>{
 const params=new URLSearchParams(location.hash.slice(1)),hash=params.get('token_hash'),type=params.get('type'),email=params.get('email'),invite=params.get('invite');
 history.replaceState(null,'',location.pathname);const $=id=>document.getElementById(id);let busy=false;
 const valid=hash&&/^[a-zA-Z0-9_-]{20,300}$/.test(hash)&&['invite','magiclink','signup'].includes(type)&&/^WMW[AG]-[a-f0-9]{48}$/.test(invite||'')&&/^\S+@\S+\.\S+$/.test(email||'');
 $('recipient').textContent=valid?'For '+email:'';
 if(!valid){$('confirm').disabled=true;$('verifyCode').disabled=true;$('status').textContent='Open the private invitation from your email. If it expired, ask your coach to resend it.';return;}
 // Keep credentials out of onward URLs. Only this same-origin tab receives the session.
 async function confirm(useCode){
  if(busy)return;busy=true;$('confirm').disabled=true;$('verifyCode').disabled=true;$('status').textContent='Confirming your email…';
  try{
   const body=useCode?{email,token:$('code').value.trim(),type:'email'}:{token_hash:hash,type};
   const response=await fetch('https://vfocpoyexnjsjpxhhyqr.supabase.co/auth/v1/verify',{method:'POST',headers:{apikey:'sb_publishable_aX7mx8Myn8sok3bhPPmphQ_fWN8o38P','Content-Type':'application/json'},body:JSON.stringify(body),credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(15000)});
   const data=await response.json();if(!response.ok||!data.access_token||!data.refresh_token||!data.user?.email_confirmed_at||String(data.user.email).toLowerCase()!==email.toLowerCase())throw Error('This link or code is expired or already used. Sign in with your existing account, or ask your coach to resend the invitation.');
   sessionStorage.setItem('wm.invite.session.v1',JSON.stringify({access_token:data.access_token,refresh_token:data.refresh_token,at:Date.now(),invite}));
   $('status').textContent='Email confirmed. Opening your team…';location.replace('/?invite='+encodeURIComponent(invite));
  }catch(e){$('status').textContent=e.message||'Could not confirm. Check your connection and try again.';$('confirm').disabled=false;$('verifyCode').disabled=false;}
  finally{busy=false;}
 }
 $('confirm').onclick=()=>confirm(false);$('codeForm').onsubmit=e=>{e.preventDefault();confirm(true);};
})();
</script></body></html>
