window.WMScoring = (() => {
 const other=c=>c==='red'?'other':'red';
 const corner=(m,c)=>c==='red'?'Red':m.style==='folkstyle'?'Green':'Blue';
 function state(m){
  let position=m.flowVersion? 'neutral':'unknown';
  for(const a of m.ledger||[]) if(!a.voided){
   if(a.position_after)position=a.position_after;
   else if(!m.flowVersion&&a.scoring){
    if(/^Takedown|^Reversal/.test(a.label))position=a.corner;
    else if(/^Escape/.test(a.label))position='neutral';
   }
  }
  return position;
 }
 function actions(m,c){
  if(m.status==='complete'||m.phase==='break')return [];
  if(m.style==='beach'&&['red','other'].some(c=>(m.ledger||[]).filter(x=>!x.voided&&x.corner===c).reduce((n,x)=>n+(Number(x.points)||0),0)>=3))return [];
  const p=state(m),a=[],add=(id,label,points,next)=>a.push({id,label,points,next});
  if(m.phase==='period'){
   if(m.style==='folkstyle'){
    if(p==='neutral')add('td','Takedown',m.takedown||3,c);
    if(p===c){for(const n of [2,3,4])add('nf'+n,'Near fall',n);}
    if(p===other(c)){add('escape','Escape',1,'neutral');add('reversal','Reversal',2,c);add('locked','Opponent locked hands',null);}
   } else if(m.style==='beach'){
    add('beach1','Ground contact (not hands)',1,'neutral');add('beach3','Back-exposure throw',3,'neutral');add('beachout','Out of bounds',1,'neutral');add('beachcaution','Opponent illegal-action caution',1,'neutral');add('beachchallenge','Opponent failed challenge',1,'neutral');add('beachwarning','Opponent verbal passivity warning',0,'neutral');
   } else {
    if(['neutral','grounded'].includes(p))add('td','Takedown',2,c);
    if(p!=='unknown'){
     add('exposure','Exposure / counter',2);
     if(p==='neutral'||p==='grounded'||p===c){add('hold2','Correct hold / lift',2);add('action4','Action',4);add('action5','Grand amplitude',5);}
     if(p===other(c))add('reversal','Reversal',1,c);
     if(p==='neutral'||p==='grounded')add('stepout','Step out',1,'neutral');
    }
   }
  }
  if(m.style==='folkstyle'&&p===c)add('stoppage','Stoppage near fall',null);
  if(m.style!=='beach')add('penalty','Penalty / warning',null);
  return a;
 }
 function apply(m,c,id,detail={}){
  if(!['red','other'].includes(c))throw Error('Choose a corner.');
  const a=actions(m,c).find(a=>a.id===id);if(!a)throw Error('That action is unavailable in this position.');
  const points=a.points===null?detail.points:a.points;
  if(!Number.isInteger(points)||points<0||points>5)throw Error('Invalid award.');
  return {...detail,label:detail.label||a.label,corner:c,points,scoring:true,action_id:id,...(a.next?{position_after:a.next}:{})};
 }
 function recordedTime(value){const d=value?new Date(value):null;return d&&!Number.isNaN(d.getTime())?d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit',timeZoneName:'short'}):'Time not recorded';}
 return {state,actions,apply,corner,other,recordedTime};
})();

return {close,get:()=>room,open:async r=>{close();if(r.token)localStorage.setItem(tokenKey(r.room),r.token);sheet.classList.remove('hidden');await enterRoom(r.room);},end:async()=>{const r=await crew('read',{room:MatHost.active().cloud.room});const h=await crew('history',{room:r.id});const q=await crew('end_session',{room:r.id,revision:r.revision,bout_id:r.state.id,confirm:true});return {current:r,history:h,ended:q.ended};}};})();
window.MatHost=(()=>{
const $=id=>document.getElementById(id),key='wm-mat-session',historyKey='wm-mat-history',recoveryKey='wm-mat-recovery';let data=null,timer=null,busy=false,pendingCloud=null;
try{data=JSON.parse(localStorage.getItem(key)||'null');if(location.hash){pendingCloud=JSON.parse(decodeURIComponent(location.hash.slice(1)));history.replaceState(null,'',location.pathname);}}catch{}
const msg=t=>$('status').textContent=t||'';
function save(){try{localStorage.setItem(key,JSON.stringify(data));}catch{throw Error('Could not save on this device. Export history before continuing.');}}
function archive(entry){const h=JSON.parse(localStorage.getItem(historyKey)||'[]');h.push(entry);localStorage.setItem(historyKey,JSON.stringify(h));}
async function pinHash(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);const a=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},k,256);return [...new Uint8Array(a)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function gate(){$('gate').innerHTML='<div class="card"><h2>Start Mat Mode</h2><p>No profile, roster, messaging or team information is available here.</p><form id="start"><label>Create exit PIN<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" required></label><label>Confirm PIN<input id="pin2" type="password" inputmode="numeric" required></label><button>Enter Mat Mode</button></form><p class="fine">4–8 digits. This is an app exit lock, not an operating-system lock. Local bouts stay on this device; export them before clearing app data.</p><a href="./index.html">Back to sign in</a></div>';if(localStorage.getItem(recoveryKey)){
 const recovery=document.createElement('form');recovery.innerHTML='<h3>Resume unfinished connected mat</h3><p>This device left without ending the mat on the server.</p><label>Previous exit PIN<input id="recoveryPin" type="password" inputmode="numeric" required></label><button>Reconnect previous mat</button>';$('gate').append(recovery);
 recovery.onsubmit=async e=>{e.preventDefault();const old=JSON.parse(localStorage.getItem(recoveryKey));try{if(Date.now()<old.lockedUntil)throw Error('Wait before trying the PIN again.');if(await pinHash($('recoveryPin').value,old.salt)!==old.hash){old.attempts=(old.attempts||0)+1;if(old.attempts>=5){old.lockedUntil=Date.now()+30000;old.attempts=0;}localStorage.setItem(recoveryKey,JSON.stringify(old));throw Error('Incorrect PIN.');}data=old;save();localStorage.removeItem(recoveryKey);location.reload();}catch(err){msg(err.message);}};
 }
 $('start').onsubmit=async e=>{e.preventDefault();if($('pin').value!==$('pin2').value){msg('PINs do not match.');return;}const b=e.submitter;b.disabled=true;try{const salt=crypto.randomUUID();data={id:crypto.randomUUID(),salt,hash:await pinHash($('pin').value,salt),officials:[],official:null,cloud:pendingCloud,match:null,attempts:0,lockedUntil:0};save();$('gate').replaceChildren();$('exit').hidden=false;await menu();}catch(e){msg(e.message);b.disabled=false;}};}
async function menu(){clearInterval(timer);MatCrew.close();$('gate').replaceChildren();$('local').innerHTML='<h2>Choose your scorebook</h2><div class="mat-choices"><button id="createMat"><b>Chairman</b><small>Create a mat & share its code</small></button><button id="pair"><b>Judge</b><small>Join a mat with its code</small></button><button id="single"><b>Single-device scorebook</b><small>Record a match on this device</small></button><button id="history"><b>Saved bouts</b><small>View & export this device’s history</small></button></div>'+(data.cloud?'<button id="resumeCloud">Open connected mat</button>':'')+'<p class="fine">Local scorebooks work without an account. For connected scoring, the chairman creates a mat here and shares its code with the judge. Neither device needs an account. Folkstyle and Beach use the single-device scorebook.</p>';$('single').onclick=()=>{if(data.cloud){msg('End the connected session before starting a local scorebook.');return;}data.match?board():setup();};$('createMat').onclick=createMat;$('pair').onclick=pair;$('history').onclick=historyView;$('resumeCloud')?.addEventListener('click',()=>openCloud());if(pendingCloud&&data.cloud){pendingCloud=null;await openCloud();}}
function createMat(){
 if(data.cloud){msg('Open your connected mat, or end it before creating another.');return;}
 if(data.match&&!data.match.complete){msg('Finish your local bout before creating a connected mat.');return;}
 $('local').innerHTML='<form id="createMatForm" class="card"><h2>Chairman · Create mat</h2><p>This device will be the chairman. Only temporary officials and bout scores are shared.</p><label>Mat name<input id="matLabel" maxlength="80" value="Mat 1" required></label><label>Style<select id="matStyle"><option value="freestyle">Freestyle · Red / Blue</option><option value="greco">Greco-Roman · Red / Blue</option></select></label><label>Scorebook<select id="matBook"><option value="competition">Competition</option><option value="test">Test</option><option value="practice">Practice</option><option value="challenge">Challenge</option></select></label><label>First bout number<input id="matBout" maxlength="24" inputmode="numeric" required></label><button>Create mat & pairing code</button></form><button id="menu">Back</button>';
 $('menu').onclick=menu;
 $('createMatForm').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{
 if(!data.createToken){data.createToken=Array.from(crypto.getRandomValues(new Uint8Array(32)),n=>n.toString(16).padStart(2,'0')).join('');save();}
 const r=await matRPC('create',{create_token:data.createToken,label:$('matLabel').value.trim(),style:$('matStyle').value,book:$('matBook').value,seconds:120,bout:$('matBout').value.trim()});
 data.cloud={room:r.id,token:r.token};save();delete data.createToken;save();await openCloud();document.getElementById('wcPair')?.click();
 }catch(err){msg(err.message);e.submitter.disabled=false;}};
}
async function openCloud(){$('local').replaceChildren();try{await MatCrew.open(data.cloud);}catch(e){msg(e.message+' Use Exit to leave this device.');}}
function pair(){if(data.cloud){msg('Open your connected mat or exit it before joining another.');return;}if(data.match&&!data.match.complete){msg('Finish or reset the local bout before pairing.');return;}$('local').innerHTML='<form id="pairForm" class="card"><h2>Join the chairman’s mat</h2><p>The chairman chooses <b>Pair other device</b> to display this code. You do not enter your exit PIN here.</p><label>Code shown on chairman’s device<input id="pairCode" maxlength="20" required inputmode="numeric" autocomplete="off" placeholder="8-digit code"></label><button>Pair this device</button></form><button id="menu">Back</button>';$('menu').onclick=menu;$('pairForm').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{const r=await matRPC('join',{code:$('pairCode').value.replace(/[^a-z0-9]/gi,'')});data.cloud={room:r.id,token:r.token};save();await openCloud();}catch(err){msg(err.message);e.submitter.disabled=false;}};}
function setup(){const prev=data.match;$('local').innerHTML=`<form id="setup" class="card"><h2>Mat scorebook</h2><label>Style<select id="style"><option value="folkstyle">Folkstyle · Red / Green</option><option value="freestyle">Freestyle · Red / Blue</option><option value="greco">Greco-Roman · Red / Blue</option><option value="beach">Beach · Red / Blue</option></select></label><label>Scorebook<select id="book"><option>Competition</option><option>Practice</option><option>Test</option><option>Challenge</option></select></label><label>Period length<select id="seconds"><option value="60">1:00</option><option value="90">1:30</option><option value="120">2:00</option><option value="180">3:00</option></select></label><label>Bout number<input id="bout" maxlength="24" required inputmode="numeric"></label><button>Start bout</button></form><button id="menu">Mat menu</button><p class="fine">Record the referee’s awards. Clock, period advancement and final result are operator-controlled. Challenge eligibility must be checked by the coach before wrestling.</p>`;$('seconds').value=prev?.seconds||120;if(prev){$('style').value=prev.style;$('book').value=prev.book;}$('style').onchange=()=>{if($('style').value==='beach')$('seconds').value=180;$('seconds').disabled=$('style').value==='beach';};$('menu').onclick=menu;$('setup').onsubmit=e=>{e.preventDefault();data.match={id:crypto.randomUUID(),bout:$('bout').value.trim(),style:$('style').value,book:$('book').value,seconds:Number($('seconds').value),remaining:Number($('seconds').value)*1000,deadline:null,period:1,phase:'period',status:'live',flowVersion:1,takedown:3,ledger:[],complete:false};save();board();};}
const remaining=()=>Math.max(0,data.match.deadline?data.match.deadline-Date.now():data.match.remaining);
function pause(){if(data.match){data.match.remaining=remaining();data.match.deadline=null;save();}}
function log(entry){data.match.ledger.push({id:crypto.randomUUID(),at:new Date().toISOString(),period:data.match.period,remaining:remaining(),official:data.officials.find(o=>o.id===data.official)||null,...entry});save();}
function timeline(m){m=m.current?.state||m.state||m;return '<details><summary>Scoring history</summary>'+(m.ledger||[]).slice().reverse().map(x=>{const a=x.award||x;return `<p>${x.voided?'[Undone] ':''}${esc(a.corner==='red'?'Red':a.corner==='blue'?'Blue':a.corner==='other'?(m.style==='folkstyle'?'Green':'Blue'):'')} ${esc(a.label||a.kind||'Action')} ${a.points?esc('+'+a.points):''}<small style="display:block">${x.period?'P'+esc(x.period)+' · ':''}Recorded ${esc(WMScoring.recordedTime(x.at))}</small></p>`;}).join('')+'</details>';}
function board(){clearInterval(timer);const m=data.match,other=m.style==='folkstyle'?'Green':'Blue',scores={red:0,other:0};m.ledger.forEach(x=>{if(!x.voided&&x.corner in scores)scores[x.corner]+=x.points||0;});$('local').innerHTML=`<h2>Bout ${esc(m.bout)} · ${esc(m.style)}</h2><label>Official<select id="official"><option value="">Select official</option>${data.officials.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select></label><details><summary>Add temporary official</summary><form id="add"><label>Name<input id="name" maxlength="80" required></label><button>Add official</button></form></details><p>Period ${m.period}</p><div id="clock" class="match-clock"></div><div class="actions">${m.complete?'':`<button id="clockToggle">${m.deadline?'Stop':'Start'} clock</button><button id="nextPeriod">Next period</button>`}<button id="menu">Mat menu</button></div><div class="grid">${['red','other'].map(c=>`<div class="corner ${c==='red'?'red':m.style==='folkstyle'?'green':'blue'}"><b>${c==='red'?'Red':other}</b><div class="score">${scores[c]}</div>${WMScoring.actions(m,c).map(a=>`<button data-award="${a.id}" data-corner="${c}">${esc(a.label)} ${a.points===null?'':a.points?'+'+a.points:''}</button>`).join('')}</div>`).join('')}</div><div id="penalty"></div>${m.complete?`<h2>${m.winner==='red'?'Red':other} wins · ${esc(m.result)}</h2><form id="nextBout"><label>Next bout number<input id="newBout" maxlength="24" required inputmode="numeric"></label><button>Start next bout</button></form>`:`<details><summary>Set start / restart position</summary><select id="position"><option value="neutral">Neutral</option><option value="red">Red controls</option><option value="other">${other} controls</option>${m.style!=='folkstyle'?'<option value="grounded">Grounded · no control</option>':''}</select><button id="setPosition">Set position</button></details><div class="actions"><button id="undo">Undo last score</button><button id="reset">Reset match</button></div><form id="finish"><h3>Finish bout</h3><label>Winner<select id="winner"><option value="red">Red</option><option value="other">${other}</option></select></label><label>Won by<select id="result"><option>Points</option><option>Fall</option><option>Tech</option></select></label><button>Review winner</button></form><div id="confirmWinner"></div>`}${timeline(m)}`;
 $('official').value=data.official||'';$('official').onchange=()=>{if(m.deadline){msg('Stop the clock before rotating officials.');$('official').value=data.official||'';return;}data.official=$('official').value;log({label:'Official selected',official:data.officials.find(o=>o.id===data.official)||null});};$('add').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(!name||data.officials.some(o=>o.name.toLowerCase()===name.toLowerCase())){msg('Enter a new name or select the official already listed.');return;}data.officials.push({id:crypto.randomUUID(),name});save();board();};
 $('menu').onclick=()=>{pause();menu();};$('clockToggle')?.addEventListener('click',()=>{if(!data.official){msg('Select an official first.');return;}if(m.deadline)pause();else m.deadline=Date.now()+m.remaining;save();board();});$('nextPeriod')?.addEventListener('click',()=>{if(m.style==='beach'){msg('Beach uses one period.');return;}pause();m.period++;m.remaining=m.seconds*1000;log({position_after:m.style==='folkstyle'?'unknown':'neutral',label:'Next period'});board();});
 document.querySelectorAll('[data-award]').forEach(b=>b.onclick=()=>{if(!data.official){msg('Select the official first.');return;}const c=b.dataset.corner,id=b.dataset.award,a=WMScoring.actions(m,c).find(x=>x.id===id);const record=detail=>{log(WMScoring.apply(m,c,id,detail));if(m.style==='beach')pause();board();};if(a.points!==null){record({});return;}$('penalty').innerHTML='<div class="card"><b>Points to add for '+esc(a.label)+'</b><div class="actions">'+(id==='stoppage'?[1,2,3,4,5]:[0,1,2]).map(n=>`<button data-points="${n}">${n===0?'Warning':n+' point'+(n===1?'':'s')}</button>`).join('')+'</div></div>';$('penalty').querySelectorAll('[data-points]').forEach(p=>p.onclick=()=>record({points:Number(p.dataset.points)}));});
 $('setPosition')?.addEventListener('click',()=>{pause();log({label:'Restart position',position_after:m.style==='beach'?'neutral':$('position').value});board();});$('undo')?.addEventListener('click',()=>{const x=[...m.ledger].reverse().find(x=>x.scoring&&!x.voided);if(x){x.voided=true;save();board();}});$('reset')?.addEventListener('click',()=>{if(!confirm('Reset scores and clock? The old record stays in history.'))return;pause();archive({reason:'reset',...structuredClone(m)});Object.assign(m,{ledger:[],remaining:m.seconds*1000,period:1,deadline:null});save();board();});
 $('finish')?.addEventListener('submit',e=>{e.preventDefault();pause();const winner=$('winner').value,result=$('result').value;$('confirmWinner').innerHTML=`<div class="card"><h3>Confirm ${winner==='red'?'Red':other} winner</h3><p>${esc(result)} · Red ${scores.red} / ${other} ${scores.other}</p><button id="confirm">Confirm winner & save</button></div>`;$('confirm').onclick=()=>{m.complete=true;m.status='complete';m.winner=winner;m.result=result;m.scores=scores;m.confirmed_at=new Date().toISOString();archive(structuredClone(m));save();board();$('newBout').focus();};});
 $('nextBout')?.addEventListener('submit',e=>{e.preventDefault();const bout=$('newBout').value.trim();if(bout===m.bout){msg('Enter a different bout number.');return;}data.match={...m,id:crypto.randomUUID(),bout,ledger:[],period:1,remaining:m.seconds*1000,deadline:null,status:'live',complete:false,winner:null,result:null,scores:null,confirmed_at:null};save();board();});
 const paint=()=>{const n=Math.ceil(remaining()/1000);if($('clock'))$('clock').textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0');};paint();timer=setInterval(paint,200);
}
function scoreSummary(m){m=m.current?.state||m.state||m;const scores={red:0,other:0};for(const e of m.ledger||[]){if(e.voided)continue;const a=e.award||e;if(a.corner==='red')scores.red+=Number(a.points)||0;else if(['other','blue'].includes(a.corner))scores.other+=Number(a.points)||0;}return 'Red '+scores.red+' / '+(m.style==='folkstyle'?'Green':'Blue')+' '+scores.other;}
function historyView(){const h=JSON.parse(localStorage.getItem(historyKey)||'[]');$('local').innerHTML='<h2>Saved bouts on this device</h2><button id="export">Export history</button><button id="menu">Back</button>'+h.slice().reverse().map(m=>`<article><b>${esc(m.bout||m.current?.state?.bout||'Connected mat')}</b><p>${esc(m.style||'Chairman & Judge')} · ${esc(m.result||m.reason||'Session record')}</p><p>${esc(scoreSummary(m))}</p>${timeline(m)}</article>`).join('');$('export').onclick=()=>downloadJSON('mat-bout-history.json',h);$('menu').onclick=menu;}
let exitVerified=false;
$('exit').onclick=()=>{exitVerified=false;$('localExit').hidden=true;$('exitPin').value='';$('exitError').textContent='';$('exitDialog').showModal();};$('cancelExit').onclick=()=>$('exitDialog').close();
$('exitForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{if(Date.now()<data.lockedUntil)throw Error('Wait before trying the PIN again.');if(await pinHash($('exitPin').value,data.salt)!==data.hash){data.attempts++;if(data.attempts>=5){data.lockedUntil=Date.now()+30000;data.attempts=0;}save();throw Error('Incorrect PIN.');}exitVerified=true;if(data.cloud){let r;try{r=await matRPC('read',{room:data.cloud.room,token:data.cloud.token});}catch(error){if(!/Mat not available|Pair this device/.test(error.message))throw error;archive({current:MatCrew.get(),reason:'Closed or replaced mat device'});}if(r){if(r.role==='chair'){const record=await MatCrew.end();archive(record);}else {await matRPC('leave_device',{room:r.id,token:data.cloud.token});archive({current:r,reason:'Judge device exit'});}}localStorage.removeItem('wm-crew-device:mat:'+data.cloud.room);}else if(data.match&&!data.match.complete){pause();archive({reason:'session exit',...data.match});}data=null;localStorage.removeItem(key);location.replace('./index.html');}catch(err){$('exitError').textContent=err.message+(exitVerified&&data.cloud?' You can leave this device now and reconnect the unfinished mat later with this PIN. The remote session will stay open.':'');$('localExit').hidden=!(exitVerified&&data.cloud);}finally{busy=false;}};
$('localExit').onclick=()=>{if(!exitVerified||busy||!data?.cloud)return;try{
 // Preserve capability and PIN privately on this device; never export the token.
 const snapshot=MatCrew.get();localStorage.setItem(recoveryKey,JSON.stringify(data));
 archive({current:snapshot,reason:'Device exit only; remote mat not ended',saved_at:new Date().toISOString()});
 MatCrew.close();clearInterval(timer);localStorage.removeItem(key);data=null;location.replace('./index.html');
 }catch(err){$('exitError').textContent='Could not preserve recovery information: '+err.message;}};
window.addEventListener('unhandledrejection',e=>msg(e.reason?.message||'Could not complete that action.'));
window.addEventListener('pagehide',()=>{if(data?.match)pause();});
setTimeout(()=>{if(data){$('exit').hidden=false;menu().then(()=>{if(data.cloud&&!pendingCloud&&!MatCrew.get())openCloud();});}else gate();},0);
return {active:()=>data,menu};})();
</script></body></html>
