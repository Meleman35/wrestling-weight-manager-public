<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://vfocpoyexnjsjpxhhyqr.supabase.co; base-uri 'none'; form-action 'none'"><title>Confirm your email | Wrestling Manager</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f9;color:#152238;font:18px/1.6 system-ui,sans-serif;padding:24px}main{max-width:540px;margin:8vh auto;padding:32px;background:white;border-radius:24px;box-shadow:0 8px 35px #15223818}small{font-weight:750;color:#143f85}h1{line-height:1.15;font-size:32px}a{display:block;padding:14px;text-align:center;border-radius:12px;background:#12449b;color:white;font-weight:700;text-decoration:none;margin-top:16px}.secondary{background:#eaf0fa;color:#153d79}p{overflow-wrap:anywhere}.note{font-size:14px;color:#506079}@media(max-width:370px){body{padding:12px}main{padding:22px}}</style></head><body><main><small>WRESTLING MANAGER</small><h1 id="title">Checking your email link…</h1><p id="status" role="status">This should only take a moment.</p><a id="openApp" href="wrestlingmanager://email-confirmed">Continue Setup in App</a><a class="secondary" id="openWebsite" href="./index.html?email-confirmed=1">Continue Setup on Website</a><p class="note">If the app does not open, open it from your Home Screen. Use the same email address your coach invited.</p></main><script>const AUTH_URL="https://vfocpoyexnjsjpxhhyqr.supabase.co",PUBLIC_KEY="sb_publishable_aX7mx8Myn8sok3bhPPmphQ_fWN8o38P";
(() => {
 const url=new URL(location.href),q=url.searchParams,h=new URLSearchParams(url.hash.slice(1));
 const token=h.get('access_token')||q.get('access_token'),failed=q.get('error')||h.get('error');
 history.replaceState(null,'',location.pathname); // Do not retain credentials in the visible URL or onward links.
 const title=document.getElementById('title'),status=document.getElementById('status');
 const uncertain=()=>{title.textContent='Return to sign in';status.textContent='This link could not be checked. If you already confirmed your email, return to the app and sign in. Otherwise, choose Resend Confirmation Email in the app and use the newest link.';};
 if(failed||!token){uncertain();return;}
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);
 fetch(AUTH_URL+'/auth/v1/user',{headers:{apikey:PUBLIC_KEY,Authorization:'Bearer '+token},signal:controller.signal,credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer'})
 .then(async response=>{if(!response.ok)throw Error('Could not verify');const user=await response.json();if(!user.email_confirmed_at)throw Error('Not confirmed');title.textContent='Email confirmed';status.textContent='Continue to Wrestling Manager to finish profile setup. Sign in if asked, then choose your existing athlete profile when a match is offered. If you already submitted a request, check its status in the app. Team access may still need coach approval.';})
 .catch(uncertain).finally(()=>clearTimeout(timer));
})();

</script></body></html>
